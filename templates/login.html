<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f5f9">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080d17">
  <title>Sign in · MediQueue ED</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('mq-theme') || 'light'; } catch (e) {}</script>
</head>
<body class="login-page" data-page="login">
  <main class="login-wrap">
    <div class="login-card card">
      <div class="brand-row">
        <div class="logo-mark big" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9.5 3h5v6.5H21v5h-6.5V21h-5v-6.5H3v-5h6.5z" fill="currentColor"/></svg></div>
        <div><h1>MediQueue</h1><p class="muted">Emergency department queue &amp; triage</p></div>
      </div>
      {% with messages = get_flashed_messages() %}
        {% for msg in messages %}<div class="callout danger flash" role="alert"><span>{{ msg }}</span></div>{% endfor %}
      {% endwith %}
      <form method="post" class="login-form">
        <div class="field"><label for="username">Username</label>
          <input id="username" name="username" autofocus required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
        <div class="field"><label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password"></div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Sign in</button>
      </form>
      <div class="demo-logins">
        <p>Demo accounts, password <code>demo123</code>. Tap one to fill the form.</p>
        <div class="chip-row">
          <button type="button" class="chip chip-btn" data-demo="priya">priya · nurse</button>
          <button type="button" class="chip chip-btn" data-demo="rao">rao · doctor</button>
          <button type="button" class="chip chip-btn" data-demo="iyer">iyer · doctor</button>
          <button type="button" class="chip chip-btn" data-demo="admin">admin</button>
        </div>
      </div>
    </div>
    <a class="board-link" href="{{ url_for('board') }}">Open the waiting-room display
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
